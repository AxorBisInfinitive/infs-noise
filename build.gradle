plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		name = 'Farlands'
		url = 'https://axorbisinfinitive.github.io/infs-farlands/maven/'
		content {
			includeModule 'com.inf.farlands', 'infs-farlands'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
	localRuntime "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
	// 临时：指向本仓库刚构建的产物与本机缓存的 Long2，用来验证新接口。验证完把这两行改回下面那行 maven 坐标。
	implementation fileTree(dir: '../../build/libs', include: ['infs-farlands-*.jar'], exclude: ['*-sources.jar'])
	implementation files("${gradle.gradleUserHomeDir}/caches/modules-2/files-2.1/com.inf.long2/Long2/0.2.1/8b95036d4b698c8d69293eeb9789b62bc1b88523/Long2-0.2.1.jar")
	// implementation "com.inf.farlands:infs-farlands:${farlands_version}"
}

processResources {
	def versions = [
		version: project.version.toString(),
		minecraft_version: project.minecraft_version,
		loader_version: project.loader_version,
		farlands_version: project.farlands_version
	]
	inputs.properties versions
	filesMatching('fabric.mod.json') {
		expand versions
	}
	// 与派生代码同目录的来源说明与许可证按同一相对路径进 jar。
	from('src/main/java') {
		include '**/*.md'
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}
